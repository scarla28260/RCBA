<div
  class="panini-card-wrapper group relative w-full rounded-2xl p-2.5 transition-all duration-300 hover:-translate-y-2 hover:shadow-2xl select-none cursor-pointer"
  [class.bg-white]="!isGold()"
  [class.shadow-lg]="!isGold()"
  [class.border-2]="!isGold()"
  [class.border-slate-200]="!isGold() && !isRare()"
  [class.border-cyan-400]="!isGold() && isRare()"
  [class.bg-gradient-to-b]="isGold()"
  [class.from-amber-200]="isGold()"
  [class.via-yellow-100]="isGold()"
  [class.to-amber-300]="isGold()"
  [class.border-4]="isGold()"
  [class.border-amber-400]="isGold()"
  [class.gold-border-glow]="isGold()"
>
  <!-- Contenu interne de la carte -->
  <div
    class="relative h-full w-full rounded-xl overflow-hidden flex flex-col justify-between"
    [class.holographic-foil]="isRare() && !isGold()"
    [class.gold-foil]="isGold()"
    [class.bg-gradient-to-br]="true"
    [class.from-[#0b154d]]="!isGold()"
    [class.via-[#101d69]]="!isGold()"
    [class.to-[#1faa18]]="!isGold()"
    [class.from-[#78350f]]="isGold()"
    [class.via-[#92400e]]="isGold()"
    [class.to-[#b45309]]="isGold()"
  >
    <!-- Texture subtile en arrière-plan -->
    <div class="absolute inset-0 bg-pitch-grid opacity-25 pointer-events-none"></div>
    <div class="absolute inset-0 bg-jersey-stripes opacity-15 pointer-events-none"></div>

    <!-- 1. En-tête de la carte : Badge officiel, Année & Blason RCBA -->
    <header class="relative z-20 flex items-center justify-between p-2.5">
      <!-- Badge Édition / Rareté -->
      <div class="flex items-center gap-1.5">
        @if (isGold()) {
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-amber-400 text-slate-950 text-[9px] font-black uppercase font-sport tracking-wider shadow-md border border-yellow-200">
            <span>👑</span> DIRECTION
          </span>
        } @else if (isRare()) {
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-gradient-to-r from-cyan-400 via-fuchsia-400 to-amber-300 text-slate-950 text-[9px] font-black uppercase font-sport tracking-wider shadow-md">
            <span>✨</span> RARE
          </span>
        } @else {
          <span class="inline-flex items-center px-1.5 py-0.5 rounded bg-white/20 backdrop-blur-xs text-white text-[9px] font-bold font-sport uppercase">
            RCBA • 26/27
          </span>
        }

        @if (number() !== undefined) {
          <span class="px-1.5 py-0.5 rounded bg-black/40 text-amber-300 font-mono text-[9px] font-black border border-white/20">
            #{{ number() }}
          </span>
        }
      </div>

      <!-- Logo / Blason officiel RCBA en haut à droite -->
      <div class="flex items-center gap-1">
        <div class="h-6 w-6 rounded-full bg-white/95 p-0.5 shadow-md flex items-center justify-center border border-white">
          <img
            src="/logo.png"
            alt="Blason RCBA"
            class="h-full w-full object-contain"
            onerror="this.style.display='none'"
          />
        </div>
      </div>
    </header>

    <!-- 2. Zone Photo du Joueur / Dirigeant (Proportions & Cadrage Visage Parfaitement Centré) -->
    <div class="relative flex-1 w-full flex items-center justify-center overflow-hidden px-2 py-1">
      <!-- Halo lumineux centré -->
      <div
        class="absolute w-36 h-36 rounded-full blur-xl opacity-40 pointer-events-none"
        [class.bg-[#3bf733]]="!isGold()"
        [class.bg-amber-300]="isGold()"
      ></div>

      <!-- Cadre photo centré aux proportions harmonieuses et constantes -->
      <div class="relative z-10 w-full h-full max-h-[175px] aspect-[4/4.5] flex items-center justify-center">
        @if (photoUrl()) {
          <img
            [ngSrc]="photoUrl()!"
            [alt]="firstName() + ' ' + lastName()"
            width="240"
            height="270"
            class="w-full h-full object-cover object-[center_18%] drop-shadow-xl transition-transform duration-500 group-hover:scale-105 rounded-xl border border-white/20 shadow-md"
            priority
          />
        } @else {
          <div
            class="w-full h-full rounded-xl flex flex-col items-center justify-center text-white shadow-xl border-2 border-white/40 backdrop-blur-xs"
            [class.bg-white/10]="!isGold()"
            [class.bg-amber-900/40]="isGold()"
          >
            <span class="text-3xl sm:text-4xl font-black font-sport tracking-wider drop-shadow-md">
              {{ initials() }}
            </span>
            <span class="text-[9px] font-semibold text-white/70 uppercase tracking-widest mt-1">
              RCBA
            </span>
          </div>
        }
      </div>
    </div>

    <!-- 3. Pied de la vignette : Catégorie, Bandeau Nom et Rôle -->
    <footer class="relative z-20 p-2.5 pt-1">
      <!-- Catégorie au-dessus du nom -->
      <div class="flex items-center justify-between mb-1">
        <span
          class="text-[9px] font-black uppercase tracking-wider px-2 py-0.5 rounded-md font-sport border shadow-xs"
          [class]="categoryBadgeBg()"
        >
          {{ category() }}
        </span>
        <span class="text-[9px] font-bold text-slate-200 tracking-wide">
          {{ role() }}
        </span>
      </div>

      <!-- Bandeau stylisé du nom en majuscules -->
      <div
        class="rounded-xl py-1.5 px-2 text-center shadow-lg border backdrop-blur-md"
        [class.bg-black/60]="!isGold()"
        [class.border-white/30]="!isGold()"
        [class.bg-gradient-to-r]="isGold()"
        [class.from-amber-950]="isGold()"
        [class.via-amber-900]="isGold()"
        [class.to-amber-950]="isGold()"
        [class.border-amber-400/60]="isGold()"
      >
        <span
          class="text-[10px] font-bold tracking-wider uppercase block leading-tight"
          [class.text-sky-300]="!isGold()"
          [class.text-amber-200]="isGold()"
        >
          {{ firstName() }}
        </span>
        <span
          class="text-sm sm:text-base font-black uppercase tracking-wider font-display leading-none block truncate"
          [class.text-white]="!isGold()"
          [class.text-amber-100]="isGold()"
        >
          {{ lastName() }}
        </span>
      </div>
    </footer>
  </div>
</div>
