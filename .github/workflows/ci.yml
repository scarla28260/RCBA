name: CI — RCBA Portal

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: 🔍 Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔎 Lint
        run: npm run lint

      - name: 🏗️ Build
        run: npm run build
        env:
          # SQLite n'est pas disponible en CI — skip les routes DB
          CI: true

      - name: ✅ Build success
        run: echo "Build completed successfully"
